[project]
name = "ai-teacher"
version = "0.1.0"
description = "Local-first adaptive AI teacher"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

